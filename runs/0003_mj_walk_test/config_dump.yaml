env:
  xml_path: models/quadruped.xml
  foot_geoms: [foot_fl, foot_fr, foot_rl, foot_rr]
  action_scale: 0.35
  frame_skip: 10
  init_height: 0.28
  target_vx: 0.4
  max_episode_sec: 10
  mass_noise: 0.15
  friction_min: 0.6
  friction_max: 1.2
  joint_damping_scale_min: 0.8
  joint_damping_scale_max: 1.2
  sensor_gyro_noise_std: 0.02
  sensor_linvel_noise_std: 0.03
  use_contact_slip_penalty: true
  use_clip_actions: true
  seed: 1234
train:
  num_envs: 8
  total_updates: 2000
  algo: PPO
  tag: mj_walk_test
  curriculum: true
  curriculum_every: 100
  curriculum_dvx: 0.1
  curriculum_vx_max: 1.5
