env:
  xml_path: /home/seoneum/walk_rl/models/quadruped.xml
  foot_geoms: [foot_fl, foot_fr, foot_rl, foot_rr]
  action_scale: 0.3
  frame_skip: 10
  init_height: 0.28
  target_vx: 0.3
  max_episode_sec: 60
  # command conditioning
  include_cmd: true
  sample_cmd_per_reset: false
  cmd_vx_min: 0.3
  cmd_vx_max: 0.3
  # domain randomization
  mass_noise: 0.05
  friction_min: 0.9
  friction_max: 1.05
  joint_damping_scale_min: 0.95
  joint_damping_scale_max: 1.05
  sensor_gyro_noise_std: 0.01
  sensor_linvel_noise_std: 0.02
  use_contact_slip_penalty: true
  use_clip_actions: true
  seed: 1234
  # reward weights
  w_speed: 2
  w_posture: 0.2
  w_yaw: 0.05
  w_action: 0.001
  w_slip: 0.02
  w_alive: 0.05
  w_angvel: 0.01
  w_act_rate: 0.005
train:
  num_envs: 16
  total_updates: 100
  algo: PPO
  tag: mj_ref_only
  curriculum: false
  curriculum_every: 100
  curriculum_dvx: 0.1
  curriculum_vx_max: 1.5
ppo:
  lr: 0.0002
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  vf_coef: 0.5
  ent_coef: 0.0003
  hidden: 128
  rollout_horizon: 512
  num_epochs: 5
  minibatch_size: 1024
  use_cuda: true
